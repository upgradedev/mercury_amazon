name: Vega OS build and virtual device run

# Builds Mercury's Vega OS app (vega/) with Amazon's Vega SDK and runs it on the
# Vega Virtual Device (VVD): armv7 for Vega Fire TV sticks, x86_64 for the VVD on
# this Intel runner. It then drives the same remote journey that
# android-tv-footage.yml films on Fire OS.
#
# Footage and build evidence, not a runtime receipt. It writes nothing that
# ci/readiness.py reads and touches none of ANDROID_TV_RUNTIME_PATHS, so gate J4
# still rests on android-tv-emulator.yml.
#
# Known limit: Amazon documents that the VVD has no WebView module on Ubuntu or
# Intel Macs (https://developer.amazon.com/docs/vega/0.24/kvd-issues.html,
# "Webview-based Vega app fails on Ubuntu"). So the run also installs Amazon's
# helloWorld template as a control. If the control renders and Mercury's install
# reports the missing module, the result is that documented limit, not a broken
# pipeline. The verdict step accepts only that outcome or a completed journey.
on:
  workflow_dispatch:
  push:
    branches: [claude/mercury-vega-20261011]
    paths:
      - vega/**
      - .github/workflows/vega-build.yml

permissions:
  contents: read

concurrency:
  group: vega-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vega:
    name: Build for Vega OS and run on the Vega Virtual Device
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/build/vega-evidence
      TEMPLATE_OUT: ${{ github.workspace }}/build/vega-template
      # 0 records unit test and type check results without stopping the build.
      VEGA_STRICT_CHECKS: "0"
      # The SDK installer and CLI take their defaults instead of prompting.
      NONINTERACTIVE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record which build the public demo serves
        shell: bash
        run: |
          mkdir -p "$OUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://leol25sezuvokpankox5cvjopm0gtvfa.lambda-url.eu-west-1.on.aws/health \
            --output "$OUT/endpoint-health.json"
          # The journey confirms a rollback, so refuse unless the public demo only records it.
          python3 -c 'import json,sys; h=json.load(open(sys.argv[1], encoding="utf-8")); d=h.get("rollback_dispatch"); assert d == "record-only", "public demo is not record-only: %r" % d; print("public demo build", h.get("build_sha"))' \
            "$OUT/endpoint-health.json"

      - name: Free disk and claim KVM
        shell: bash
        run: |
          df -h / | tail -1
          # Toolchains this job never touches (android-tv-footage.yml frees the first four).
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/az /usr/share/swift \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          df -h / | tail -1
          # /dev/kvm exists on the fleet but the runner user is not in the kvm group.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -la /dev/kvm || echo 'no /dev/kvm on this host'
          nproc; free -h

      - name: Install the host packages the SDK and the VVD use
        shell: bash
        run: |
          sudo apt-get update -qq
          # jq, lz4, curl, tar: the SDK installer and install-vega-sdk.html. Xvfb and
          # Mesa llvmpipe: software GL for the emulator's -gpu host path.
          sudo apt-get install -y -qq jq lz4 curl tar ca-certificates xvfb x11-utils mesa-utils \
            libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 libx11-xcb1 libxcb1 iproute2 ffmpeg > /dev/null
          node -v; npm -v; python3 --version

      - name: Install the Vega SDK
        id: sdk
        timeout-minutes: 45
        run: bash vega/ci/install_sdk.sh

      - name: Generate the vegaWebview and helloWorld templates
        id: templates
        timeout-minutes: 10
        run: bash vega/ci/templates.sh

      - name: Build Mercury for Vega OS (armv7, x86_64)
        id: build
        timeout-minutes: 45
        run: bash vega/ci/build_app.sh mercury

      - name: Upload the vpkgs
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mercury-vega-vpkg-${{ github.sha }}
          path: build/vega-evidence/vpkg/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the generated vegaWebview template
        if: always() && steps.templates.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vega-webview-template-${{ github.sha }}
          path: build/vega-template/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Build the helloWorld control for the VVD
        id: control_build
        if: always() && steps.templates.outcome == 'success'
        timeout-minutes: 30
        run: bash vega/ci/build_app.sh control

      - name: Boot the Vega Virtual Device
        id: boot
        if: always() && steps.templates.outcome == 'success'
        timeout-minutes: 35
        run: bash vega/ci/vvd_boot.sh

      - name: Control, the helloWorld template on the VVD
        id: control
        if: always() && steps.boot.outcome == 'success' && steps.control_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: bash vega/ci/vvd_control.sh

      - name: Mercury on the VVD, board and remote journey
        id: mercury
        if: always() && steps.boot.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: bash vega/ci/vvd_journey.sh

      - name: Write provenance and assemble the frames into a video
        if: always()
        shell: bash
        run: |
          mkdir -p "$OUT"
          if [ ! -s "$OUT/journey.webm" ]; then python3 vega/ci/provenance.py "$OUT" --stitch || true; fi
          if [ -f "$OUT/logs/device.log" ]; then gzip -f "$OUT/logs/device.log"; fi
          python3 vega/ci/provenance.py "$OUT"
          ls -la "$OUT" "$OUT/frames" 2>/dev/null | head -80

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mercury-vega-evidence-${{ github.sha }}
          path: |
            build/vega-evidence/
            !build/vega-evidence/vpkg/
          if-no-files-found: error
          retention-days: 30

      - name: Verdict
        if: always()
        run: python3 vega/ci/provenance.py "$OUT" --verdict
