name: Android TV runtime proof

on:
  workflow_dispatch:

jobs:
  emulator-golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build the exact public-candidate APK
        run: >-
          ./gradlew :app:assembleDebug --stacktrace
          -PmercuryCockpitUrl=https://leol25sezuvokpankox5cvjopm0gtvfa.lambda-url.eu-west-1.on.aws/
      - name: Verify the public candidate matches this checkout
        shell: bash
        run: |
          mkdir -p build/android-tv-evidence
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://leol25sezuvokpankox5cvjopm0gtvfa.lambda-url.eu-west-1.on.aws/health \
            --output build/android-tv-evidence/endpoint-health.json
          python -c 'import json,sys; actual=json.load(open(sys.argv[2], encoding="utf-8")).get("build_sha"); expected=sys.argv[1]; assert actual == expected, f"deployed build {actual!r} != workflow SHA {expected}"' \
            "${GITHUB_SHA}" build/android-tv-evidence/endpoint-health.json
      - name: Pre-create the TV AVD with a small data partition
        run: |
          # The runner cannot set disk.dataPartition.size, and the 6G default
          # fails the free-space check on the runner (run 36649294389: 3.06G
          # available, 7.37G needed). 1.5G fits the APK install plus WebView.
          # No --device flag: the AOSP image ships no tv_1080p profile, and the
          # journey sends D-pad keyevents only, so 1080p geometry set below is
          # all it needs (Leanback and WebView come from the image itself).
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install 'system-images;android-34;android-tv;x86' > /dev/null
          echo no | avdmanager create avd --force -n test \
            --package 'system-images;android-34;android-tv;x86'
          printf 'disk.dataPartition.size=1610612736\nhw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=320\n' >> ~/.android/avd/test.avd/config.ini

      - name: Install and drive the Android TV D-pad journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 34 x86 is the newest TV image on the stable channel
          # (sdkmanager --list, 2026-09-30): android-35 ships no TV image and
          # android-34 ships no x86_64 one. android-tv (AOSP, no Play
          # Services) boots inside the runner's window where google-tv hangs;
          # it still ships WebView and the Leanback launcher the APK needs.
          # Do not bump without re-listing.
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          heap-size: 512M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_tv_smoke.sh
      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mercury-android-tv-runtime-${{ github.sha }}
          path: build/android-tv-evidence/
          if-no-files-found: error
