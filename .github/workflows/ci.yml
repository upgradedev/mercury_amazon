name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  manual-apk-build:
    name: Build this revision's APK (hardware verification remains separate)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android.yml

  test-and-verify:
    name: Lint, test, benchmark, audit
    runs-on: ubuntu-24.04
    env:
      MERCURY_REQUIRE_BROWSER: "1"
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Browser evidence tests resolve the documented before-state commit.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ux]"
          pip install build

      - name: Install Chromium for required browser measurements
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check src/ tests/ scripts/ ci/ --ignore E501

      - name: Validate locked infrastructure
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra init -backend=false -input=false -no-color
          terraform -chdir=infra validate -no-color

      - name: Test suite with the coverage floor
        run: |
          python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Coverage summary agrees with the README
        # The README quotes a coverage percentage and a statement count. A test
        # pins them to coverage_summary.json cheaply; this step is what proves
        # that recorded file still matches a real measurement, and fails the job
        # when either number has drifted.
        run: python scripts/record_coverage_summary.py --check

      - name: Correlation trial agrees with the recorded summary
        # The README quotes correlation_trial_summary.json and a test pins the two
        # together. This step is what proves that recorded file is still what the
        # committed correlator produces against the committed corpus, so a change
        # to the detector cannot leave a stale accuracy figure in the README.
        run: python scripts/correlation_trial.py --check

      - name: Held-out attribution figures agree with the recorded summary
        # The figure printed beside a named commit is measured on the held-out split.
        # This proves attribution_holdout_summary.json is what the committed engine
        # produces on that split: every field except the run metadata, including the
        # split block and the delay-ceiling sensitivity rows.
        run: python scripts/attribution_split.py --check

      - name: Naive attribution baselines agree with the recorded summary
        # docs/EVIDENCE.md compares the shipped engine with blame-the-latest-deploy and
        # blame-every-deploy-in-the-window on the same held-out cases. This proves
        # attribution_baselines_summary.json is what the committed rules produce there.
        run: python scripts/naive_attribution_baselines.py --check

      - name: Train-split tuning record agrees with a fresh sweep
        # A test pins the shipped engine to attribution_tuning_summary.json, so the
        # record itself is re-derived here rather than trusted.
        run: python scripts/tune_attribution.py --check

      - name: D-pad spatial navigation spec (real navigator, executed in Node)
        run: node tests/e2e/spatial_nav_spec.js

      - name: Latency benchmark
        # Order matters. This rewrites benchmarks_summary.json, and a test in
        # tests/e2e/test_documentation_claims.py holds the README table to that
        # file, so it must run after the test suite. Lower iteration counts than
        # the local default keep the job short; the committed numbers come from
        # a local run at 60/2000.
        run: python scripts/benchmark_suite.py 20 500

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Standards readiness audit
        # Fails the job on any blocking gate. Gates that need a deployment, a
        # video or hardware still print FAIL, with the reason they are exempt.
        run: python ci/readiness.py
