name: Enterprise CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test, Security & Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff build pydantic fastapi httpx boto3

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/ --ignore E501

      - name: Execute Full Test Suite & Enforce Coverage (>=85%)
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Run Performance & Latency Benchmark
        run: |
          if [ -d "tests/performance" ]; then
            python -m pytest tests/performance/ -v
          fi

      - name: Build Local Production Artifacts (Wheel & Sdist)
        run: |
          if [ -f "pyproject.toml" ]; then
            python -m build --wheel --sdist --outdir dist
          fi

      - name: Verify Readiness Gate (ci/readiness.py)
        run: |
          python ci/readiness.py
