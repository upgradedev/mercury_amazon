name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run linter
        run: |
          python -m ruff check .

      - name: Run unit tests with coverage
        run: |
          python -m pytest --cov=src --cov-fail-under=85 --cov-report=term-missing tests/
        env:
          PYTHONPATH: .

      - name: Run submission readiness audit
        run: |
          python ci/readiness.py
