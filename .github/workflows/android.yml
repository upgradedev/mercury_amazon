name: Fire TV APK

# Builds the Fire OS / Android Leanback APK on a runner that has the Android SDK,
# runs the JVM unit tests for the D-pad bridge and URL resolver, and uploads the
# APK as a downloadable artifact.
#
# This exists because the APK cannot be built in every contributor's environment:
# it needs a JDK and the Android SDK. Running it here makes the build result
# reproducible and checkable by anyone who can open the Actions tab, rather than
# something the maintainer asserts.
#
# It runs on every push to the default branch and on demand from the Actions tab.
# There is deliberately no paths filter: the first push after this file was
# written has to produce an APK whatever else that push touches, and a filter
# that skipped it would leave the repository in the state it is in today, with a
# workflow that has never executed. The build is a few minutes of runner time.
#
# What this workflow proves is that the APK assembles. It does not prove the app
# runs on a Fire TV: that needs a device, and the receipt gate J4 asks for
# (firetv_build_receipt.json, written by scripts/write_firetv_receipt.py) is
# completed by an owner after an adb install and a launch on hardware. The sha256
# printed below is what that receipt records for the APK this run produced.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-apk:
    name: Assemble debug APK and run JVM unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's legacy default also asks sdkmanager for the removed
          # package named `tools`. Keep the package list explicit so a runner
          # image update cannot fail before Gradle resolves platform 34.
          packages: platform-tools

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show the resolved Gradle and Android toolchain
        run: ./gradlew --version

      - name: Run the JVM unit tests (DpadBridge, CockpitUrlResolver)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble the debug APK for the public candidate
        run: >-
          ./gradlew :app:assembleDebug --stacktrace
          -PmercuryCockpitUrl=https://leol25sezuvokpankox5cvjopm0gtvfa.lambda-url.eu-west-1.on.aws/

      - name: Report what was produced, with the digest the build receipt records
        run: |
          echo "APK files produced by this run:"
          find app/build/outputs -name "*.apk" -print -exec ls -la {} \;
          echo "sha256 of app-debug.apk (copy into firetv_build_receipt.json via scripts/write_firetv_receipt.py):"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the Fire TV APK
        uses: actions/upload-artifact@v7
        with:
          name: mercury-firetv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mercury-firetv-unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn
