  <text x="72" y="144" fill="#F3F0E9" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="5">MERCURY</text>
  <text x="74" y="184" fill="#FFB23F" font-family="Arial, sans-serif" font-size="23">One temporal candidate, or why not.</text>
  <text x="74" y="244" fill="#B7B9BD" font-family="Arial, sans-serif" font-size="14" letter-spacing="1">INCIDENT TRIAGE  /  REMOTE FIRST  /  RECORD-ONLY</text>
