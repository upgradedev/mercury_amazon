<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Mercury: Fire TV incident triage</title>
  <desc id="desc">A charcoal incident-board banner with amber focus styling and a D-pad. One temporal candidate, or why not. Record-only by default.</desc>
